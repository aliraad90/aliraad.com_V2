version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm --version
        - node --version
        - cd client
        - npm install --include=dev
    build:
      commands:
        - npm run build
        - echo "/*    /index.html   200" > dist/_redirects
  artifacts:
    baseDirectory: client/dist
    files:
      - '**/*'
  cache:
    paths:
      - client/node_modules/**/*
      - client/.vite/**/*
