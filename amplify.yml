version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm --version
        - node --version
        - cd client
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: client/dist
    files:
      - '**/*'
  cache:
    paths:
      - client/node_modules/**/*
      - client/.vite/**/*
