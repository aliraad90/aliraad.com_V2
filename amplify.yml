version: 1
backend:
  phases:
    build:
      commands:
        - npm install
        - npx ampx sandbox --once
frontend:
  phases:
    preBuild:
      commands:
        - npm --version
        - node --version
        - cd client
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: client/dist
    files:
      - '**/*'
  cache:
    paths:
      - client/node_modules/**/*
      - client/.vite/**/*
      - node_modules/**/*
