version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm --version
        - node --version
        - cd client
        - npm install --include=dev
    build:
      commands:
        - npm run build
        - echo '/* /index.html 200' > client/dist/_redirects
        - echo '/* /index.html 200' > client/dist/200.html
  artifacts:
    baseDirectory: client/dist
    files:
      - '**/*'
  cache:
    paths:
      - client/node_modules/**/*
      - client/.vite/**/*
